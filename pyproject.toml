[project]
name = "highspl"
version = "0.1.0"
description = "High SPL adaptive noise cancellation and speech enhancement system"
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Runtime (what the Raspberry Pi needs): no torch, no GUI, no eval tooling.
dependencies = [
    "numpy>=2.4.6",
    "omegaconf>=2.3.1",
    "onnxruntime>=1.29.0",
    "psutil>=7.2.2",
    "scipy>=1.17.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
# Developer machines get everything. On the Pi use: uv sync --no-default-groups
default-groups = ["dev", "eval", "train"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
# Desktop lab UIs.
lab = [
    "customtkinter>=5.2.2",
    "pyqt6>=6.7.0",
    "pyqtgraph>=0.13.7",
]
# Synthetic data + objective evaluation.
eval = [
    "librosa>=0.11.0",
    "pesq>=0.0.4",
    "pyroomacoustics>=0.10.1",
    "pystoi>=0.4.1",
]
# Training / export. CUDA wheels are only used on x86 machines; aarch64 (Pi)
# resolves torch from PyPI.
train = [
    "hydra-core>=1.3.5",
    "onnx>=1.22.0",
    "onnxscript>=0.7.1",
    "onnxsim>=0.7.3",
    "torch==2.11.0",
    "torchaudio==2.11.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "platform_machine == 'x86_64' or platform_machine == 'AMD64'" }
torchaudio = { index = "pytorch-cu126", marker = "platform_machine == 'x86_64' or platform_machine == 'AMD64'" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # makes the `laboratory` package importable
markers = [
    "slow: long-running evaluation / generation tests",
]
