[project]
name = "highspl"
version = "0.1.0"
description = "High SPL adaptive noise cancellation and speech enhancement system"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "hydra-core>=1.3.5",
    "librosa>=0.11.0",
    "numpy>=2.4.6",
    "omegaconf>=2.3.1",
    "onnx>=1.22.0",
    "onnxruntime>=1.29.0",
    "onnxscript>=0.7.1",
    "onnxsim>=0.7.3",
    "pesq>=0.0.4",
    "psutil>=7.2.2",
    "pyroomacoustics>=0.10.1",
    "pystoi>=0.4.1",
    "scipy>=1.17.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
    "torch==2.11.0",
    "torchaudio==2.11.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
