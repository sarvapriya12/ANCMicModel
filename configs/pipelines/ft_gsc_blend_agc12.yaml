# Candidate final system: blended GSC front-end + AGC (-12 dBFS) + limiter, with the
# neural stage fine-tuned on stage-1 outputs of the synthetic battlefield set.
model:
  onnx_path: models/fastenhancer/b/ft_gsc_blend_agc12.onnx
pipeline:
  frontend:
    mode: gsc
    blend: true
  level:
    output_gain_db: 0.0
    agc_enabled: true
    agc_target_dbfs: -12.0
    limiter_enabled: true
